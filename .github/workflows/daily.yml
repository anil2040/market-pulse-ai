name: MarketPulse Daily Briefing

on:
  schedule:
    - cron: "55 12 * * 1-5"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 google-genai

      - name: Run MarketPulse AI
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          YAHOO_EMAIL:         ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASSWORD:  ${{ secrets.YAHOO_APP_PASSWORD }}
          FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
          MFI_EMAIL:           ${{ secrets.MFI_EMAIL }}
          MFI_PASSWORD:        ${{ secrets.MFI_PASSWORD }}
          AM_EMAIL:            ${{ secrets.AM_EMAIL }}
          AM_PASSWORD:         ${{ secrets.AM_PASSWORD }}
        run: python main.py

      - name: Commit and push dashboard
        run: |
          git config user.name  "MarketPulse Bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update: MarketPulse briefing $(date +'%Y-%m-%d')"
          git push
