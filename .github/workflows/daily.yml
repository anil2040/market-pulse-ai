name: MarketPulse Daily Briefing

on:
  schedule:
    - cron: "50 13 * * 1-5"   # 7:50 AM MT (13:50 UTC) -- 20 min after market open
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Pull latest commits
        run: git pull origin main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 google-genai anthropic

      - name: Fetch and cache slow data sources
        run: python fetch_cache.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit cache files
        run: |
          git config user.name  "MarketPulse Bot"
          git config user.email "actions@github.com"
          git add dataroma_cache.json am_cache.json || true || true
          git diff --staged --quiet || git commit -m "Cache update: $(date +'%Y-%m-%d')"
          git push || true

      - name: Run MarketPulse AI
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          YAHOO_EMAIL:         ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASSWORD:  ${{ secrets.YAHOO_APP_PASSWORD }}
          FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
          MFI_EMAIL:           ${{ secrets.MFI_EMAIL }}
          MFI_PASSWORD:        ${{ secrets.MFI_PASSWORD }}
          AM_EMAIL:            ${{ secrets.AM_EMAIL }}
          AM_PASSWORD:         ${{ secrets.AM_PASSWORD }}
        run: python main.py

      - name: Commit and push dashboard
        run: |
          git config user.name  "MarketPulse Bot"
          git config user.email "actions@github.com"
          git add index.html run_cache.json || true
          git diff --staged --quiet || git commit -m "Auto-update: MarketPulse briefing $(date +'%Y-%m-%d')"
          git push