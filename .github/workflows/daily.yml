name: MarketPulse Daily Briefing

on:
  schedule:
    - cron: "55 12 * * 1-5"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 google-genai anthropic

      - name: Fetch and cache slow data sources
        # Runs fetch_cache.py BEFORE main.py.
        # Writes dataroma_cache.json to disk.
        # Commits it so it persists across ephemeral runners.
        # Exit 0 always -- cache failure is non-fatal (main.py has fallback).
        run: python fetch_cache.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Commit cache files
        # Commit dataroma_cache.json before main.py runs.
        # This ensures the cache is available even if the main step fails.
        run: |
          git config user.name  "MarketPulse Bot"
          git config user.email "actions@github.com"
          git add dataroma_cache.json am_cache.json || true || true
          git diff --staged --quiet || git commit -m "Cache update: $(date +'%Y-%m-%d')"
          git push || true

      - name: Run MarketPulse AI
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }} 
          YAHOO_EMAIL:         ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASSWORD:  ${{ secrets.YAHOO_APP_PASSWORD }}
          FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
          MFI_EMAIL:           ${{ secrets.MFI_EMAIL }}
          MFI_PASSWORD:        ${{ secrets.MFI_PASSWORD }}
          AM_EMAIL:            ${{ secrets.AM_EMAIL }}
          AM_PASSWORD:         ${{ secrets.AM_PASSWORD }}
        run: python main.py

      - name: Commit and push dashboard
        run: |
          git config user.name  "MarketPulse Bot"
          git config user.email "actions@github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Auto-update: MarketPulse briefing $(date +'%Y-%m-%d')"
          git push