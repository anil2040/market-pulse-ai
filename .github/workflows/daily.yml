# ============================================================
# MarketPulse Daily Briefing -- GitHub Actions workflow
# ============================================================
#
# WHEN IT RUNS (three triggers):
#
#   1. PUSH (the normal way). The Claude Routine ("Daily Market Warmup", weekdays
#      7:40 AM Mountain, set in the Claude app) saves clauderoutinedata.json and
#      pushes it. That push starts this workflow within a minute. No clock is involved,
#      so GitHub's scheduler delays (hours, since late Aug 2026) do not matter, and
#      there is no daylight saving problem. Running the routine by hand, or editing
#      that file yourself, starts the workflow too. Code pushes do NOT start it.
#
#   2. BACKUP SCHEDULE, weekdays 15:17 UTC (9:17 AM MDT in summer, 8:17 AM MST in
#      winter; both are fine, it only needs to be after the routine). It is for days
#      when the routine did not run. It does nothing if today's page was already built.
#      GitHub may start it late; that is acceptable for a backup.
#
#   3. MANUAL: the "Run workflow" button on the Actions tab. Always runs.
#
# "pages build and deployment" entries in the Actions list are GitHub's own publisher.
# They run after every push to main and only publish files already in the repo.
#
# ONE COMMIT: the pipeline (main.py) writes index.html, run_cache.json and, when a live
#   Dataroma fetch worked, dataroma_cache.json. This workflow commits them together at the
#   end and retries the push if another push arrived at the same moment.
#
# RED X = EMAIL: if a source needing your attention is missing, main.py ends with exit
#   code 1 AFTER publishing the dashboard. GitHub shows a red X and emails you. Turn this
#   off with NOTIFY_ON_FAILURE = False in main.py.
#
# PYTHON: 3.13, the same as the owner's laptop. Test on the version used here.
# ============================================================

name: MarketPulse Daily Briefing

on:
  push:
    branches: [main]
    paths:
      - "clauderoutinedata.json"
  schedule:
    - cron: "17 15 * * 1-5"   # backup only, see above
  workflow_dispatch:

concurrency:
  group: marketpulse
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 50        # main.py reads git history for the routine's real commit time

      - name: Decide whether to run
        id: gate
        env:
          EVENT: ${{ github.event_name }}
        run: |
          RUN=true
          if [ "$EVENT" = "schedule" ]; then
            # Backup schedule: skip when today's page (Boise date) is already built.
            LAST=$(git log -1 --format=%cI -- index.html)
            LAST_DAY=$(TZ=America/Boise date -d "${LAST:-1970-01-01}" +%F)
            TODAY=$(TZ=America/Boise date +%F)
            echo "Backup schedule: index.html last built $LAST_DAY, today is $TODAY"
            if [ "$LAST_DAY" = "$TODAY" ]; then
              RUN=false
              echo "Today's page already exists, nothing to do."
            fi
          fi
          echo "Event=$EVENT -> run=$RUN"
          echo "run=$RUN" >> "$GITHUB_OUTPUT"

      - name: Pull latest commits
        if: steps.gate.outputs.run == 'true'
        run: git pull --rebase origin main

      - name: Set up Python
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: pip install requests beautifulsoup4 google-genai anthropic

      - name: Run MarketPulse AI
        if: steps.gate.outputs.run == 'true'
        env:
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY:   ${{ secrets.ANTHROPIC_API_KEY }}
          YAHOO_EMAIL:         ${{ secrets.YAHOO_EMAIL }}
          YAHOO_APP_PASSWORD:  ${{ secrets.YAHOO_APP_PASSWORD }}
          FRED_API_KEY:        ${{ secrets.FRED_API_KEY }}
          MFI_EMAIL:           ${{ secrets.MFI_EMAIL }}
          MFI_PASSWORD:        ${{ secrets.MFI_PASSWORD }}
          AM_EMAIL:            ${{ secrets.AM_EMAIL }}
          AM_PASSWORD:         ${{ secrets.AM_PASSWORD }}
        run: python main.py

      # always(): publish the dashboard even when main.py ended with the
      # deliberate "needs attention" exit code 1.
      - name: Commit and push dashboard
        if: always() && steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "MarketPulse Bot"
          git config user.email "actions@github.com"
          for f in index.html run_cache.json dataroma_cache.json; do
            [ -f "$f" ] && git add "$f"
          done
          if git diff --staged --quiet; then
            echo "Nothing changed, nothing to commit."
            exit 0
          fi
          git commit -m "Auto-update: MarketPulse briefing $(TZ=America/Boise date +'%Y-%m-%d')"
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "Push failed (attempt $i). Rebasing on the latest main and retrying..."
            git pull --rebase origin main || true
            sleep 5
          done
          echo "Push failed 3 times."
          exit 1